<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directives</title>
    <style>
        .box{
            background-color: blue;
            height: 200px;
            width: 200px;
        }
        .box.two{
            background-color: pink;
        }
        .box.three{
            background-color: red;
        }
        [v-cloak]{
            display:none;
        }
    </style>
</head>
<body>
    <div id="app" v-cloak>
            {{ greeting }}
            <br>
            <input type="text" v-model="greeting"/>
            <hr>
            <!-- <div class="box" v-show="isVisible"></div> -->
            <div class="box" v-if="isVisible"></div>
            <div class="box three" v-else-if="isVisible2"></div>
            <div class="box two" v-else></div>

    </div>
    <script src="https://unpkg.com/vue@3"></script>
    <script>
        let app = Vue.createApp({
            data: function(){
                return{
                    greeting: "Hello",
                    name: "Peter",
                    isVisible: false,
                    isVisible2: true
                }
            }
        })
        app.mount("#app")  
    </script>
</body>
</html>
